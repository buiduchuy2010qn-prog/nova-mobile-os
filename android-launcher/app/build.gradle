plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.novaos.launcher'
    compileSdk 35

    defaultConfig {
        applicationId "vn.novaos.launcher"
        minSdk 26
        targetSdk 35
        versionCode 160
        versionName "16.0-HybridLite-VN"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
